<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cores — Gove Design System</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Montserrat:wght@700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#3D0099;text-decoration:none}a:hover{color:#20133D}
a:focus-visible,button:focus-visible{outline:2px solid #FFC72C;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F4F4; font-family: Inter, system-ui, sans-serif; color: #2F3539; display: flex; flex-direction: column">

<header style="background: #3D0099; border-radius: 0 0 32px 32px; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 4px">
<a href="Main.dc.html" aria-label="Voltar para o início" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<h1 style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 24px; color: #FFFFFF">Cores</h1>
</div>
<div role="tablist" aria-label="Cores" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 5px; border-radius: 9999px; background: rgba(255,255,255,0.14)">
<sc-for list="{{views}}" as="v" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{v.sel}}" onClick="{{v.pick}}" style="min-height: 44px; border: 0; border-radius: 9999px; background: {{v.bg}}; color: {{v.fg}}; font: 700 14px Inter, sans-serif; cursor: pointer">{{v.label}}</button>
</sc-for>
</div>
</header>

<main style="flex: 1; overflow: auto; padding: 18px 20px 120px; display: flex; flex-direction: column; gap: 16px">
<sc-if value="{{isCompass}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div role="tablist" aria-label="Etapas" style="display: flex; gap: 8px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{s.sel}}" onClick="{{s.pick}}" style="flex: 1; min-height: 44px; border-radius: 9999px; border: 0; background: {{s.bg}}; color: {{s.fg}}; font: 600 13px Inter, sans-serif; cursor: pointer">{{s.label}}</button>
</sc-for>
</div>

<div style="align-self: center; position: relative; width: 200px; height: 200px; border-radius: 9999px; background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.35) 38%, rgba(255,255,255,0) 70%), conic-gradient(from 0deg, #ffe600 0deg, #ff8a00 45deg, #ff1a1a 90deg, #ff00b3 135deg, #8a00ff 165deg, #3b00ff 190deg, #0066ff 215deg, #00e6e6 260deg, #00e65c 300deg, #7dff00 330deg, #ffe600 360deg)" role="img" aria-label="Bússola de cores">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="10">
<span title="{{d.name}}" style="position: absolute; left: {{d.x}}; top: {{d.y}}; width: {{d.size}}; height: {{d.size}}; transform: translate(-50%, -50%); border-radius: 9999px; border: 2px solid #FFFFFF; background: {{d.hex}}; opacity: {{d.op}}; box-shadow: 0 2px 6px rgba(0,0,0,0.25)"></span>
</sc-for>
</div>

<sc-if value="{{isContext}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="10">
<div style="border-radius: 18px; background: #FFFFFF; box-shadow: 0 4px 12px rgba(32,19,61,0.06)">
<div style="display: flex; align-items: center; gap: 10px; padding-left: 12px">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 9px; background: {{c.hex}}; border: 1px solid #E3D8F3"></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 700; font-size: 14px; color: #20133D">{{c.name}}</span>
<span style="font-size: 11px; color: #5B6770">{{c.group}}</span>
</span>
<span style="font-family: ui-monospace, monospace; font-size: 12px; color: #2F3539">{{c.hex}}</span>
<button type="button" onClick="{{c.toggle}}" aria-expanded="{{c.open}}" aria-label="Detalhes de {{c.name}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #5B6770; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{c.rot}}"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</div>
<sc-if value="{{c.isOpen}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 0 14px 12px; font-size: 13px; line-height: 1.45">{{c.text}}</p>
</sc-if>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isTopic}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{topics}}" as="t" hint-placeholder-count="6">
<button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 14px; border-radius: 9999px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font: 600 12px Inter, sans-serif; cursor: pointer; box-shadow: 0 2px 6px rgba(32,19,61,0.06)">{{t.label}}</button>
</sc-for>
</div>
<sc-if value="{{hasTopic}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; height: 14px; border-radius: 9999px; overflow: hidden; box-shadow: inset 0 0 0 1px #E3D8F3">
<sc-for list="{{mix}}" as="m" hint-placeholder-count="4">
<span style="width: {{m.w}}; background: {{m.hex}}"></span>
</sc-for>
</div>
</sc-if>
</sc-if>

<sc-if value="{{isTone}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{words}}" as="w" hint-placeholder-count="9">
<button type="button" aria-pressed="{{w.on}}" onClick="{{w.pick}}" style="min-height: 48px; border-radius: 16px; border: 2px solid {{w.border}}; background: {{w.bg}}; color: {{w.fg}}; font: 700 12px Inter, sans-serif; cursor: pointer">{{w.label}}</button>
</sc-for>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{isLogo}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="border-radius: 24px; background: #FFFFFF; padding: 28px; display: flex; justify-content: center; box-shadow: 0 4px 12px rgba(32,19,61,0.06)"><img src="/_blob/3c0ba613a16cb3f688df66fc82439380" alt="Logotipo roxo sobre branco" style="height: 40px; width: auto"></div>
<div style="border-radius: 24px; background: #20133D; padding: 28px; display: flex; justify-content: center"><img src="/_blob/fc530f879f699d6fe98563c5000569f4" alt="Logotipo branco e amarelo sobre Roxo Noite" style="height: 40px; width: auto"></div>
<div style="border-radius: 24px; background: #3D0099; padding: 22px; display: flex; justify-content: center"><img src="/_blob/67ef8fef05bec5a45132bca311aa4cce" alt="Símbolo branco sobre Roxo Gove" style="height: 52px; width: auto"></div>
<p style="margin: 0; font-size: 13px; line-height: 1.45">Cada cor da logo precisa de 4,5:1 com o fundo. Símbolo em espaços quadrados; logotipo em faixas.</p>
</div>
</sc-if>
</main>

<nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 24px rgba(32,19,61,0.08); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 8px 12px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<sc-if value="{{t.center}}" hint-placeholder-val="{{ false }}">
<a href="{{t.href}}" aria-label="{{t.label}}" style="justify-self: center; width: 60px; height: 60px; margin-top: -34px; border-radius: 20px; transform: rotate(45deg); background: #FFC72C; box-shadow: 0 8px 20px rgba(255,199,44,0.55); display: flex; align-items: center; justify-content: center; color: #20133D">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(-45deg)"><path d="{{t.d}}"></path></svg>
</a>
</sc-if>
<sc-if value="{{t.side}}" hint-placeholder-val="{{ true }}">
<a href="{{t.href}}" aria-current="{{t.current}}" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: {{t.color}}; font-size: 11px; font-weight: 600">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
{{t.label}}
</a>
</sc-if>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'compass', step: 'context', open: null, topic: null, words: [] };
  }
  renderVals() {
    const ICON = {
      home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
      apps: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
      search: 'M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM20 20l-4-4',
      palette: 'M12 3a9 9 0 1 0 0 18c1.1 0 1.5-.8 1.5-1.6 0-.9-.6-1.4-.6-2.2 0-.9.7-1.6 1.6-1.6H17a4 4 0 0 0 4-4c0-4.7-4-8.6-9-8.6zM7.5 11.5h.01M10 7.5h.01M15 7.5h.01',
      book: 'M4 5a2 2 0 0 1 2-2h5v16H6a2 2 0 0 0-2 2zM20 5a2 2 0 0 0-2-2h-5v16h5a2 2 0 0 1 2 2zM15 9l1.5 1.5L19 8',
    };
    const tabs = [['home', 'Início', 'Main.dc.html'], ['apps', 'Apps', 'Aplicacoes.dc.html'], ['search', 'Buscar', 'Main.dc.html'], ['palette', 'Cores', 'Cores.dc.html'], ['book', 'Guias', 'Guias.dc.html']]
      .map(([id, label, href]) => ({ label, href, d: ICON[id], center: id === 'search', side: id !== 'search', current: id === 'palette' ? 'page' : 'false', color: id === 'palette' ? '#3D0099' : '#5B6770' }));
    const C = [
      ['#F4F4F4', 'Gelo', 'principal', 49, 49, 'Neutralidade e clareza: cria o palco para as outras cores.'],
      ['#20133D', 'Roxo Noite', 'principal', 63, 83, 'Autoridade e credibilidade; fundo do tema escuro.'],
      ['#FFC72C', 'Amarelo Ouro', 'principal', 54, 11, 'Energia e otimismo; uma ação principal por tela.'],
      ['#3D0099', 'Roxo Gove', 'principal', 71, 92, 'Marca e inovação digital; botões principais.'],
      ['#351F65', 'Roxo Profundo', 'secundária', 62, 80, 'Sofisticação premium; bordas no escuro.'],
      ['#2F3539', 'Grafite', 'secundária', 43, 60, 'Base estrutural; texto de corpo no claro.'],
      ['#5B6770', 'Cinza Azulado', 'secundária', 45, 57, 'Técnica e equilíbrio; texto secundário.'],
      ['#5AC2CD', 'Ciano', 'secundária', 30, 68, 'Frescor e descoberta; informação e gráficos.'],
      ['#A278DA', 'Lilás', 'secundária', 59, 69, 'Acolhimento e criatividade; humaniza a interface.'],
      ['#16499F', 'Azul', 'secundária', 38, 89, 'Confiança e segurança; links e gráficos.'],
    ];
    const TOPICS = [
      ['Cidadania', [['#A278DA', 46], ['#F4F4F4', 38], ['#2F3539', 16]]],
      ['Saúde e ambiente', [['#5AC2CD', 45], ['#F4F4F4', 28], ['#3D0099', 14], ['#20133D', 13]]],
      ['Educação e tecnologia', [['#3D0099', 53], ['#A278DA', 21], ['#F4F4F4', 14], ['#5AC2CD', 12]]],
      ['Economia', [['#16499F', 53], ['#FFC72C', 21], ['#F4F4F4', 14], ['#2F3539', 12]]],
      ['Segurança', [['#20133D', 53], ['#5B6770', 21], ['#F4F4F4', 14], ['#5AC2CD', 12]]],
      ['Gestão pública', [['#F4F4F4', 41], ['#351F65', 31], ['#FFC72C', 14], ['#16499F', 13]]],
    ];
    const WORDS = [['Sofisticada', ['#20133D', '#351F65']], ['Incomum', ['#A278DA', '#351F65']], ['Intelectual', ['#3D0099', '#16499F']], ['Profunda', ['#20133D', '#3D0099']], ['Tranquila', ['#5AC2CD', '#F4F4F4']], ['Tecnológica', ['#3D0099', '#5AC2CD']], ['Equilibrada', ['#5B6770', '#F4F4F4']], ['Confiável', ['#16499F', '#2F3539']], ['Otimista', ['#FFC72C']]];
    const st = this.state;
    const topicHex = st.topic === null ? [] : TOPICS[st.topic][1].map((m) => m[0]);
    let hi = [];
    if (st.step === 'topic') hi = topicHex;
    if (st.step === 'tone') hi = st.topic !== null ? topicHex : st.words.flatMap((i) => WORDS[i][1]);
    const any = hi.length > 0;
    const dots = C.map(([hex, name, , x, y]) => {
      const on = !any || hi.includes(hex);
      return { hex, name, x: x + '%', y: y + '%', size: any && on ? '26px' : '20px', op: on ? '1' : '0.35' };
    });
    const colors = C.map(([hex, name, group, , , text]) => ({ hex, name, group, text, isOpen: st.open === hex, open: st.open === hex ? 'true' : 'false', rot: st.open === hex ? 'rotate(180deg)' : 'none', toggle: () => this.setState({ open: st.open === hex ? null : hex }) }));
    const topics = TOPICS.map(([label], i) => ({ label, on: st.topic === i ? 'true' : 'false', bg: st.topic === i ? '#3D0099' : '#FFFFFF', fg: st.topic === i ? '#FFFFFF' : '#20133D', pick: () => this.setState({ topic: st.topic === i ? null : i }) }));
    const mix = st.topic === null ? [] : TOPICS[st.topic][1].map(([hex, w]) => ({ hex, w: w + '%' }));
    const related = new Set(WORDS.flatMap(([, cs], i) => (cs.some((h) => topicHex.includes(h)) ? [i] : [])));
    const words = WORDS.map(([label], i) => {
      const on = st.words.includes(i);
      const rel = related.has(i);
      return { label, on: on ? 'true' : 'false', bg: on ? '#3D0099' : rel ? '#FFF1C9' : '#FFFFFF', fg: on ? '#FFFFFF' : '#20133D', border: on ? '#3D0099' : rel ? '#FFC72C' : '#E3D8F3', pick: () => this.setState({ words: on ? st.words.filter((w) => w !== i) : [...st.words, i].slice(-3) }) };
    });
    const views = [['compass', 'Bússola'], ['logo', 'Logomarca']].map(([id, label]) => ({ label, sel: st.view === id ? 'true' : 'false', bg: st.view === id ? '#FFFFFF' : 'transparent', fg: st.view === id ? '#3D0099' : '#FFFFFF', pick: () => this.setState({ view: id }) }));
    const steps = [['context', 'Contexto'], ['topic', 'Pauta'], ['tone', 'Tom']].map(([id, label]) => ({ label, sel: st.step === id ? 'true' : 'false', bg: st.step === id ? '#3D0099' : '#FFFFFF', fg: st.step === id ? '#FFFFFF' : '#20133D', pick: () => this.setState({ step: id }) }));
    return {
      tabs, views, steps, dots, colors, topics, mix, words,
      isCompass: st.view === 'compass', isLogo: st.view === 'logo',
      isContext: st.step === 'context', isTopic: st.step === 'topic', isTone: st.step === 'tone',
      hasTopic: st.topic !== null,
    };
  }
}
</script>
</body>
</html>
