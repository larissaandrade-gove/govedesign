<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cores — Gove Design System</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Montserrat:wght@700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#3D0099;text-decoration:none}a:hover{color:#20133D}
a:focus-visible,button:focus-visible{outline:2px solid #FFC72C;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F4F4; font-family: Inter, system-ui, sans-serif; color: #2F3539; display: flex; flex-direction: column">

<header style="background: #3D0099; border-radius: 0 0 32px 32px; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 4px">
<a href="Main.dc.html" aria-label="Voltar para o início" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<svg width="24" height="24"  aria-hidden="true" viewBox="0 0 256 256" fill="currentColor"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path></svg>
</a>
<h1 style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 24px; color: #FFFFFF">Cores</h1>
</div>
<div role="tablist" aria-label="Cores" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 5px; border-radius: 9999px; background: rgba(255,255,255,0.14)">
<sc-for list="{{views}}" as="v" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{v.sel}}" onClick="{{v.pick}}" style="min-height: 44px; border: 0; border-radius: 9999px; background: {{v.bg}}; color: {{v.fg}}; font: 700 14px Inter, sans-serif; cursor: pointer">{{v.label}}</button>
</sc-for>
</div>
</header>

<main style="flex: 1; overflow: auto; padding: 18px 20px 120px; display: flex; flex-direction: column; gap: 16px">
<sc-if value="{{isCompass}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div role="tablist" aria-label="Etapas" style="display: flex; gap: 8px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{s.sel}}" onClick="{{s.pick}}" style="flex: 1; min-height: 44px; border-radius: 9999px; border: 0; background: {{s.bg}}; color: {{s.fg}}; font: 600 13px Inter, sans-serif; cursor: pointer">{{s.label}}</button>
</sc-for>
</div>

<div style="align-self: center; position: relative; width: 200px; height: 200px; border-radius: 9999px; background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.35) 38%, rgba(255,255,255,0) 70%), conic-gradient(from 0deg, #ffe600 0deg, #ff8a00 45deg, #ff1a1a 90deg, #ff00b3 135deg, #8a00ff 165deg, #3b00ff 190deg, #0066ff 215deg, #00e6e6 260deg, #00e65c 300deg, #7dff00 330deg, #ffe600 360deg)" role="img" aria-label="Bússola de cores">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="10">
<span title="{{d.name}}" style="position: absolute; left: {{d.x}}; top: {{d.y}}; width: {{d.size}}; height: {{d.size}}; transform: translate(-50%, -50%); border-radius: 9999px; border: 2px solid #FFFFFF; background: {{d.hex}}; opacity: {{d.op}}; box-shadow: 0 2px 6px rgba(0,0,0,0.25)"></span>
</sc-for>
</div>

<sc-if value="{{isContext}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="10">
<div style="border-radius: 18px; background: #FFFFFF; box-shadow: 0 4px 12px rgba(32,19,61,0.06)">
<div style="display: flex; align-items: center; gap: 10px; padding-left: 12px">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 9px; background: {{c.hex}}; border: 1px solid #E3D8F3"></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 700; font-size: 14px; color: #20133D">{{c.name}}</span>
<span style="font-size: 11px; color: #5B6770">{{c.group}}</span>
</span>
<span style="font-family: ui-monospace, monospace; font-size: 12px; color: #2F3539">{{c.hex}}</span>
<button type="button" onClick="{{c.toggle}}" aria-expanded="{{c.open}}" aria-label="Detalhes de {{c.name}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #5B6770; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18"  aria-hidden="true" style="transform: {{c.rot}}" viewBox="0 0 256 256" fill="currentColor"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg>
</button>
</div>
<sc-if value="{{c.isOpen}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 0 14px 12px; font-size: 13px; line-height: 1.45">{{c.text}}</p>
</sc-if>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isTopic}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{topics}}" as="t" hint-placeholder-count="6">
<button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 14px; border-radius: 9999px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font: 600 12px Inter, sans-serif; cursor: pointer; box-shadow: 0 2px 6px rgba(32,19,61,0.06)">{{t.label}}</button>
</sc-for>
</div>
<sc-if value="{{hasTopic}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; height: 14px; border-radius: 9999px; overflow: hidden; box-shadow: inset 0 0 0 1px #E3D8F3">
<sc-for list="{{mix}}" as="m" hint-placeholder-count="4">
<span style="width: {{m.w}}; background: {{m.hex}}"></span>
</sc-for>
</div>
</sc-if>
</sc-if>

<sc-if value="{{isTone}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{words}}" as="w" hint-placeholder-count="9">
<button type="button" aria-pressed="{{w.on}}" onClick="{{w.pick}}" style="min-height: 48px; border-radius: 16px; border: 2px solid {{w.border}}; background: {{w.bg}}; color: {{w.fg}}; font: 700 12px Inter, sans-serif; cursor: pointer">{{w.label}}</button>
</sc-for>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{isLogo}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="border-radius: 24px; background: #FFFFFF; padding: 28px; display: flex; justify-content: center; box-shadow: 0 4px 12px rgba(32,19,61,0.06)"><img src="/_blob/3c0ba613a16cb3f688df66fc82439380" alt="Logotipo roxo sobre branco" style="height: 40px; width: auto"></div>
<div style="border-radius: 24px; background: #20133D; padding: 28px; display: flex; justify-content: center"><img src="/_blob/fc530f879f699d6fe98563c5000569f4" alt="Logotipo branco e amarelo sobre Noite" style="height: 40px; width: auto"></div>
<div style="border-radius: 24px; background: #3D0099; padding: 22px; display: flex; justify-content: center"><img src="/_blob/67ef8fef05bec5a45132bca311aa4cce" alt="Símbolo branco sobre Roxo Gove" style="height: 52px; width: auto"></div>
<p style="margin: 0; font-size: 13px; line-height: 1.45">Cada cor da logo precisa de 4,5:1 com o fundo. Símbolo em espaços quadrados; logotipo em faixas.</p>
</div>
</sc-if>
</main>

<nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #FFFFFF; border-top: 1px solid #E3D8F3; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" aria-current="{{t.current}}" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.color}}; font-size: 12px; font-weight: {{t.weight}}">
<span style="width: 64px; height: 32px; border-radius: 9999px; background: {{t.pill}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{t.d}}"></path></svg></span>
{{t.label}}
</a>
</sc-for>
</nav>
</div>
</x-dc>
