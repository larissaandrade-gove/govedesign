<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Início — Gove Design System</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Montserrat:wght@700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#3D0099;text-decoration:none}a:hover{color:#20133D}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #FFC72C;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F4F4; font-family: Inter, system-ui, sans-serif; color: #2F3539; display: flex; flex-direction: column">

<header style="background: #3D0099; border-radius: 0 0 32px 32px; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 18px; position: relative; overflow: hidden">
<span aria-hidden="true" style="position: absolute; right: -40px; top: -30px; width: 160px; height: 160px; border-radius: 9999px; border: 22px solid rgba(162,120,218,0.35)"></span>
<span aria-hidden="true" style="position: absolute; right: 60px; top: 70px; width: 26px; height: 26px; border-radius: 9999px; background: #5AC2CD"></span>
<div style="display: flex; align-items: center; justify-content: space-between; position: relative">
<img src="/_blob/fc530f879f699d6fe98563c5000569f4" alt="Gove" style="height: 24px; width: auto">
<button type="button" aria-label="Tema escuro" style="width: 44px; height: 44px; border-radius: 9999px; border: 0; background: rgba(255,255,255,0.14); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"></path></svg>
</button>
</div>
<div style="position: relative">
<h1 style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.15; color: #FFFFFF">Olá!</h1>
<p style="margin: 4px 0 0; font-size: 15px; color: #E9E1F7">O que vamos criar hoje?</p>
</div>
<label style="position: relative; display: flex; align-items: center; height: 52px; padding: 0 6px 0 20px; border-radius: 9999px; background: #FFFFFF; gap: 8px">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar</span>
<input type="search" placeholder="Buscar apps, cores, guias" style="flex: 1; min-width: 0; border: 0; outline: none; font: 16px Inter, sans-serif; color: #20133D; background: transparent">
<span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 9999px; background: #3D0099; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM20 20l-4-4"></path></svg>
</span>
</label>
</header>

<main style="flex: 1; overflow: auto; padding: 20px 20px 120px; display: flex; flex-direction: column; gap: 24px">
<section style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 18px; color: #20133D">Aplicações</h2>
<a href="Aplicacoes.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600">Ver todas</a>
</div>
<div style="display: flex; gap: 12px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 4px">
<sc-for list="{{apps}}" as="app" hint-placeholder-count="6">
<a href="{{app.href}}" style="flex: none; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #20133D">
<span style="width: 72px; height: 72px; border-radius: 22px; background: {{app.bg}}; color: {{app.fg}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(32,19,61,0.10)">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{app.d}}"></path></svg>
</span>
<span style="font-size: 12px; font-weight: 600; text-align: center; line-height: 1.25">{{app.name}}</span>
</a>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 18px; color: #20133D">Solicitações</h2>
<a href="Solicitacoes.dc.html" style="min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; background: #FFC72C; color: #20133D; font-weight: 700; font-size: 16px; box-shadow: 0 6px 18px rgba(255,199,44,0.45)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Abrir nova solicitação</a>
</section>

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 18px; color: #20133D">Fundamentos</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<a href="Cores.dc.html" style="grid-row: span 2; border-radius: 24px; background: #3D0099; color: #FFFFFF; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; min-height: 220px; position: relative; overflow: hidden">
<span aria-hidden="true" style="position: absolute; right: -24px; bottom: -24px; width: 120px; height: 120px; border-radius: 9999px; background: conic-gradient(#FFE600, #FF8A00, #FF1A1A, #FF00B3, #8A00FF, #0066FF, #00E6E6, #00E65C, #FFE600); opacity: 0.9"></span>
<span style="font-family: Montserrat, sans-serif; font-weight: 800; font-size: 20px; position: relative">Cores</span>
<span style="font-size: 13px; color: #E9E1F7; position: relative; max-width: 110px">Bússola, pautas e tons</span>
</a>
<a href="Cores.dc.html" style="border-radius: 24px; background: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 104px; box-shadow: 0 6px 16px rgba(32,19,61,0.08); color: #20133D">
<img src="/_blob/3c0ba613a16cb3f688df66fc82439380" alt="" style="height: 18px; width: auto; align-self: flex-start">
<span style="font-weight: 700; font-size: 15px">Logomarca</span>
</a>
<a href="Guias.dc.html" style="border-radius: 24px; background: #FFC72C; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 104px; color: #20133D">
<span style="font-family: Montserrat, sans-serif; font-weight: 900; font-size: 28px; line-height: 1">Aa</span>
<span style="font-weight: 700; font-size: 15px">Guias</span>
</a>
</div>
</section>
</main>

<nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 24px rgba(32,19,61,0.08); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 8px 12px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<sc-if value="{{t.center}}" hint-placeholder-val="{{ false }}">
<a href="{{t.href}}" aria-label="{{t.label}}" style="justify-self: center; width: 60px; height: 60px; margin-top: -34px; border-radius: 20px; transform: rotate(45deg); background: #FFC72C; box-shadow: 0 8px 20px rgba(255,199,44,0.55); display: flex; align-items: center; justify-content: center; color: #20133D">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(-45deg)"><path d="{{t.d}}"></path></svg>
</a>
</sc-if>
<sc-if value="{{t.side}}" hint-placeholder-val="{{ true }}">
<a href="{{t.href}}" aria-current="{{t.current}}" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: {{t.color}}; font-size: 11px; font-weight: 600">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
{{t.label}}
</a>
</sc-if>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ICON = {
      home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
      apps: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
      search: 'M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM20 20l-4-4',
      palette: 'M12 3a9 9 0 1 0 0 18c1.1 0 1.5-.8 1.5-1.6 0-.9-.6-1.4-.6-2.2 0-.9.7-1.6 1.6-1.6H17a4 4 0 0 0 4-4c0-4.7-4-8.6-9-8.6zM7.5 11.5h.01M10 7.5h.01M15 7.5h.01',
      book: 'M4 5a2 2 0 0 1 2-2h5v16H6a2 2 0 0 0-2 2zM20 5a2 2 0 0 0-2-2h-5v16h5a2 2 0 0 1 2 2zM15 9l1.5 1.5L19 8',
    };
    const active = 'home';
    const tabs = [
      ['home', 'Início', 'Main.dc.html'],
      ['apps', 'Apps', 'Aplicacoes.dc.html'],
      ['search', 'Buscar', 'Main.dc.html'],
      ['palette', 'Cores', 'Cores.dc.html'],
      ['book', 'Guias', 'Guias.dc.html'],
    ].map(([id, label, href]) => ({ label, href, d: ICON[id], center: id === 'search', side: id !== 'search', current: id === active ? 'page' : 'false', color: id === active ? '#3D0099' : '#5B6770' }));
    const apps = [
      { name: 'Revisor', href: 'Aplicacoes.dc.html', bg: '#FFFFFF', fg: '#3D0099', d: 'M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M11 8a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM16 16l-2.6-2.6' },
      { name: 'Criativos', href: 'Aplicacoes.dc.html', bg: '#FFC72C', fg: '#20133D', d: 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 3v4M17 5h4M5 17v4M3 19h4' },
      { name: 'Follow-ups', href: 'Aplicacoes.dc.html', bg: '#FFFFFF', fg: '#3D0099', d: 'M4 5h16v16H4zM4 9h16M8 3v4M16 3v4M9 15l2 2 4-4' },
      { name: 'Links', href: 'Aplicacoes.dc.html', bg: '#5AC2CD', fg: '#20133D', d: 'M9 15l6-6M11 6l1-1a5 5 0 0 1 7 7l-1 1M13 18l-1 1a5 5 0 0 1-7-7l1-1' },
      { name: 'LP Builder', href: 'Aplicacoes.dc.html', bg: '#FFFFFF', fg: '#3D0099', d: 'M3 4h18v6H3zM3 14h8v6H3zM15 14h6M15 18h6' },
    ];
    return { tabs, apps };
  }
}
</script>
</body>
</html>
