<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Aplicações — Gove Design System</title>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Montserrat:wght@700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#3D0099;text-decoration:none}a:hover{color:#20133D}
a:focus-visible,button:focus-visible{outline:2px solid #FFC72C;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F4F4; font-family: Inter, system-ui, sans-serif; color: #2F3539; display: flex; flex-direction: column">

<a href="Main.dc.html" aria-label="Voltar para o início" style="position: relative; width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #20133D">

</a>
<div style="position: relative">
<h1 style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1; color: #20133D">Aplicações</h1>
<p style="margin: 4px 0 0; font-size: 14px; color: #5B6770">{{count}} ferramentas</p>
</div>
<div role="group" aria-label="Filtrar" style="position: relative; display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button type="button" aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="flex: none; min-height: 40px; padding: 0 16px; border-radius: 9999px; border: 0; font: 600 13px Inter, sans-serif; background: {{f.bg}}; color: {{f.fg}}; cursor: pointer">{{f.label}}</button>
</sc-for>
</div>
</header>

<main style="flex: 1; overflow: auto; padding: 18px 20px 120px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{apps}}" as="app" hint-placeholder-count="3">
<a href="{{app.href}}" target="{{app.target}}" rel="noopener" aria-label="{{app.label}}" aria-disabled="{{app.soon}}" style="opacity: {{app.opacity}}; display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 10px 12px 10px 10px; border-radius: 22px; background: {{app.cardBg}}; box-shadow: 0 6px 16px rgba(32,19,61,0.07); color: #20133D">
<span style="flex: none; width: 56px; height: 56px; border-radius: 18px; background: {{app.tileBg}}; color: {{app.tileFg}}; display: flex; align-items: center; justify-content: center">
<svg width="26" height="26"  aria-hidden="true" viewBox="0 0 256 256" fill="currentColor"><path d="{{app.d}}"></path></svg>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 700; font-size: 15px">{{app.name}}</span>
<span style="font-size: 13px; color: #2F3539">{{app.line}}</span>
</span>
<sc-if value="{{app.featured}}" hint-placeholder-val="{{ false }}">
<span style="flex: none; align-self: stretch; margin: -10px -12px -10px 0; padding: 0 16px; border-radius: 0 22px 22px 0; background: #FFC72C; display: flex; align-items: center; font-weight: 700; font-size: 14px">Abrir</span>
</sc-if>
<sc-if value="{{app.soon}}" hint-placeholder-val="{{ false }}">
<span style="flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 9999px; background: rgba(255,199,44,0.25); color: #20133D; font: 600 11px/16px Inter, sans-serif; white-space: nowrap">Em breve</span>
</sc-if>
<sc-if value="{{app.plain}}" hint-placeholder-val="{{ true }}">
<svg width="20" height="20"  aria-hidden="true" viewBox="0 0 256 256" fill="currentColor"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg>
</sc-if>
</a>
</sc-for>
</main>

<nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #FFFFFF; border-top: 1px solid #E3D8F3; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" aria-current="{{t.current}}" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.color}}; font-size: 12px; font-weight: {{t.weight}}">
<span style="width: 64px; height: 32px; border-radius: 9999px; background: {{t.pill}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{t.d}}"></path></svg></span>
{{t.label}}
</a>
</sc-for>
</nav>
</div>
</x-dc>
