<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Aplicações — Gove Design System</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Montserrat:wght@700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#3D0099;text-decoration:none}a:hover{color:#20133D}
a:focus-visible,button:focus-visible{outline:2px solid #FFC72C;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F4F4; font-family: Inter, system-ui, sans-serif; color: #2F3539; display: flex; flex-direction: column">

<header style="background: #FFFFFF; border-radius: 0 0 32px 32px; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; box-shadow: 0 6px 18px rgba(32,19,61,0.06)">
<span aria-hidden="true" style="position: absolute; right: -30px; top: -40px; width: 140px; height: 140px; border-radius: 9999px; background: #E6DAF6"></span>
<span aria-hidden="true" style="position: absolute; right: 70px; top: 18px; width: 36px; height: 36px; border-radius: 9999px; background: #FFC72C"></span>
<span aria-hidden="true" style="position: absolute; right: 24px; top: 96px; width: 18px; height: 18px; border-radius: 9999px; background: #5AC2CD"></span>
<a href="Main.dc.html" aria-label="Voltar para o início" style="position: relative; width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #20133D">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<div style="position: relative">
<h1 style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1; color: #20133D">Aplicações</h1>
<p style="margin: 4px 0 0; font-size: 14px; color: #5B6770">{{count}} ferramentas</p>
</div>
<div role="group" aria-label="Filtrar" style="position: relative; display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="flex: none; min-height: 40px; padding: 0 16px; border-radius: 9999px; border: 0; font: 600 13px Inter, sans-serif; background: {{f.bg}}; color: {{f.fg}}; cursor: pointer">{{f.label}}</button>
</sc-for>
</div>
</header>

<main style="flex: 1; overflow: auto; padding: 18px 20px 120px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{apps}}" as="app" hint-placeholder-count="6">
<a href="{{app.href}}" target="{{app.target}}" rel="noopener" aria-label="Abrir {{app.name}}" style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 10px 12px 10px 10px; border-radius: 22px; background: {{app.cardBg}}; box-shadow: 0 6px 16px rgba(32,19,61,0.07); color: #20133D">
<span style="flex: none; width: 56px; height: 56px; border-radius: 18px; background: {{app.tileBg}}; color: {{app.tileFg}}; display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{app.d}}"></path></svg>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 700; font-size: 15px">{{app.name}}</span>
<span style="font-size: 13px; color: #2F3539">{{app.line}}</span>
</span>
<sc-if value="{{app.featured}}" hint-placeholder-val="{{ false }}">
<span style="flex: none; align-self: stretch; margin: -10px -12px -10px 0; padding: 0 16px; border-radius: 0 22px 22px 0; background: #FFC72C; display: flex; align-items: center; font-weight: 700; font-size: 14px">Abrir</span>
</sc-if>
<sc-if value="{{app.plain}}" hint-placeholder-val="{{ true }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6770" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</sc-if>
</a>
</sc-for>
</main>

<nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 24px rgba(32,19,61,0.08); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 8px 12px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<sc-if value="{{t.center}}" hint-placeholder-val="{{ false }}">
<a href="{{t.href}}" aria-label="{{t.label}}" style="justify-self: center; width: 60px; height: 60px; margin-top: -34px; border-radius: 20px; transform: rotate(45deg); background: #FFC72C; box-shadow: 0 8px 20px rgba(255,199,44,0.55); display: flex; align-items: center; justify-content: center; color: #20133D">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(-45deg)"><path d="{{t.d}}"></path></svg>
</a>
</sc-if>
<sc-if value="{{t.side}}" hint-placeholder-val="{{ true }}">
<a href="{{t.href}}" aria-current="{{t.current}}" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: {{t.color}}; font-size: 11px; font-weight: 600">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
{{t.label}}
</a>
</sc-if>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'todas' };
  }
  renderVals() {
    const ICON = {
      home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
      apps: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
      search: 'M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM20 20l-4-4',
      palette: 'M12 3a9 9 0 1 0 0 18c1.1 0 1.5-.8 1.5-1.6 0-.9-.6-1.4-.6-2.2 0-.9.7-1.6 1.6-1.6H17a4 4 0 0 0 4-4c0-4.7-4-8.6-9-8.6zM7.5 11.5h.01M10 7.5h.01M15 7.5h.01',
      book: 'M4 5a2 2 0 0 1 2-2h5v16H6a2 2 0 0 0-2 2zM20 5a2 2 0 0 0-2-2h-5v16h5a2 2 0 0 1 2 2zM15 9l1.5 1.5L19 8',
    };
    const tabs = [['home', 'Início', 'Main.dc.html'], ['apps', 'Apps', 'Aplicacoes.dc.html'], ['search', 'Buscar', 'Main.dc.html'], ['palette', 'Cores', 'Cores.dc.html'], ['book', 'Guias', 'Guias.dc.html']]
      .map(([id, label, href]) => ({ label, href, d: ICON[id], center: id === 'search', side: id !== 'search', current: id === 'apps' ? 'page' : 'false', color: id === 'apps' ? '#3D0099' : '#5B6770' }));
    const ALL = [
      { name: 'Revisor de identidade', line: 'Audita peças contra a marca', tag: 'marca', d: 'M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M11 8a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM16 16l-2.6-2.6' },
      { name: 'Gerador de criativos', line: 'Peças de mídia paga em lote', tag: 'midia', d: 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 3v4M17 5h4M5 17v4M3 19h4' },
      { name: 'Gerador de follow-ups', line: 'Produto e eventos, 4:3 e 1:1', tag: 'midia', d: 'M4 5h16v16H4zM4 9h16M8 3v4M16 3v4M9 15l2 2 4-4' },
      { name: 'Gove Links', line: 'Links curtos com cliques e QR', tag: 'web', d: 'M9 15l6-6M11 6l1-1a5 5 0 0 1 7 7l-1 1M13 18l-1 1a5 5 0 0 1-7-7l1-1' },
      { name: 'LP Builder', line: 'Landing pages em minutos', tag: 'web', d: 'M3 4h18v6H3zM3 14h8v6H3zM15 14h6M15 18h6' },
    ];
    const FILTERS = [['todas', 'Todas'], ['midia', 'Mídia'], ['web', 'Web'], ['marca', 'Marca']];
    const f = this.state.filter;
    const filters = FILTERS.map(([id, label]) => ({ label, on: f === id ? 'true' : 'false', bg: f === id ? '#3D0099' : '#F4F4F4', fg: f === id ? '#FFFFFF' : '#20133D', pick: () => this.setState({ filter: id }) }));
    const list = ALL.filter((a) => f === 'todas' || a.tag === f);
    const apps = list.map((a) => {
      const featured = false;
      return { ...a, href: featured ? 'App.dc.html' : 'https://claude.ai/artifact/B3Xx5AUqZNC8enfrV36AAm', target: featured ? '_self' : '_blank', featured, plain: !featured, cardBg: featured ? '#FFF6DB' : '#FFFFFF', tileBg: featured ? '#FFFFFF' : '#EFE9F8', tileFg: '#3D0099' };
    });
    return { tabs, filters, apps, count: list.length };
  }
}
</script>
</body>
</html>
