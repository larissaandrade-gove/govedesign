<title>Gove Design System Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Moldura de celular no computador; tela cheia no celular. O Design System roda dentro, com todos os apps. */
:root{--ground:#F4F4F4;--frame:#20133D;--ink:#2F3539;--muted:#5B6770;--brand:#3D0099;--font:Inter,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#20133D;--frame:#000000;--ink:#F4F4F4;--muted:#A278DA;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#20133D;--frame:#000000;--ink:#F4F4F4;--muted:#A278DA;color-scheme:dark}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font);margin:0}
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.phone{width:390px;height:min(844px,calc(100% - 8px));border:12px solid var(--frame);border-radius:52px;overflow:hidden;background:#fff;box-shadow:0 24px 60px rgba(32,19,61,.25);flex:none}
.phone iframe{width:100%;height:100%;border:0;display:block}
.side{max-width:280px;display:flex;flex-direction:column;gap:8px}
.side h1{margin:0;font:800 28px/1.15 Montserrat,Helvetica,Arial,sans-serif;color:var(--ink);text-wrap:balance}
.side p{margin:0;font-size:15px;line-height:1.5;color:var(--muted)}
@media (max-width:760px){
  .stage{padding:0}
  .side{display:none}
  .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
}
</style>
<div class="stage">
  <div class="phone"><iframe id="ds" src="ds.html" title="Gove Design System no celular"></iframe></div>
  <div class="side">
    <h1>Gove Design System Mobile</h1>
    <p>Apps, cores, guias e solicitações, na versão de celular.</p>
  </div>
</div>
