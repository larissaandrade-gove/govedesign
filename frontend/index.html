<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gove Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: #1A153A;
      --surface: #2A3233;
      --primary: #4A00E0;
      --secondary: #3A2E6B;
      --accent: #FFC72C;
      --text-strong: #FFFFFF;
      --focus-ring: var(--accent);
      --shadow-md: 0 8px 16px rgba(0, 0, 0, 0.6);
      --glow-purple: 0 0 20px rgba(74, 0, 224, 0.4);
      --display: Montserrat, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 16px;
      background: var(--background);
      font-family: var(--display);
    }
    main { width: 100%; max-width: 1000px; }
    nav {
      width: 100%;
      max-width: 1000px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }
    a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 160px;
      padding: 32px 24px;
      border: 1px solid var(--secondary);
      border-radius: 16px;
      background: var(--surface);
      color: var(--text-strong);
      font-size: 24px;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
      text-decoration: none;
      transition: transform 200ms ease-in-out, border-color 200ms ease-in-out, box-shadow 200ms ease-in-out;
    }
    a:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: var(--shadow-md), var(--glow-purple); }
    a:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (max-width: 860px) { nav { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { nav { grid-template-columns: 1fr; } a { min-height: 112px; font-size: 20px; } }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } a:hover { transform: none; } }
  </style>
</head>
<body>
  <main>
    <h1 class="sr-only">Gove Design</h1>
    <nav aria-label="Aplicações">
      <a href="/revisor/">Revisor de identidade visual</a>
      <a href="/criativos">Gerador de criativos</a>
      <a href="/links">Gove Links</a>
      <a href="/lp">LP Builder</a>
      <a href="/print-studio/">Print Studio — Kit de Boas-Vindas</a>
    </nav>
  </main>
</body>
</html>
